<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>活着的意义 0.2.3 内测版</title>
<h1>修复修改作息后的数据读取与更新阻塞</h1>
<ul>
  <li>修复延后下班、调整上班时间或跨夜排班后，原打卡和运行记录被误判无效的问题。</li>
  <li>保留原有设置、打卡、运行记录与更正记录；金额仍按当前班次计算。</li>
  <li>写入前执行与读取一致的数据校验，避免保存后重启无法读取。</li>
  <li>读取失败时保留原文件、暂停记录，并允许退出或安装更新。</li>
  <li>正常使用时若新数据写入失败，继续阻止退出，避免丢失未保存的内容。</li>
</ul>
<p>旧版本若因保存弹窗无法更新，请先备份本地数据，再强制退出并手动覆盖安装。</p>
</html>
